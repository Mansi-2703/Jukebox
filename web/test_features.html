<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>features.js — Quick Test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; }
    #dropZone {
      border: 3px dashed #666; border-radius: 12px; padding: 3rem;
      text-align: center; cursor: pointer; margin-bottom: 1rem;
      transition: border-color 0.2s;
    }
    #dropZone.over { border-color: #2196F3; background: #e3f2fd; }
    canvas { display: block; margin: 1rem 0; border: 1px solid #ccc; }
    pre { background: #f5f5f5; padding: 1rem; overflow-x: auto; font-size: 0.85rem; }
    #progress { margin: 0.5rem 0; }
  </style>
</head>
<body>
  <h1>🌍 Feature Extractor Test</h1>
  <p>Drop a video file to extract features frame-by-frame.</p>

  <div id="dropZone">
    <p>📂 Drag & drop a video here, or click to browse</p>
    <input type="file" id="fileInput" accept="video/*" hidden>
  </div>

  <div id="progress"></div>
  <video id="video" muted hidden></video>
  <canvas id="canvas"></canvas>
  <h3>Features (first frame):</h3>
  <pre id="output">Waiting for video…</pre>
  <h3>All frames summary:</h3>
  <pre id="summary"></pre>

  <script type="module">
    import { extractFeatures, extractAllFrames, N_STRIPS } from './features.js';

    const dropZone  = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const video     = document.getElementById('video');
    const canvas    = document.getElementById('canvas');
    const output    = document.getElementById('output');
    const summary   = document.getElementById('summary');
    const progress  = document.getElementById('progress');

    // ── drag & drop ──
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('over');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) handleFile(fileInput.files[0]);
    });

    async function handleFile(file) {
      output.textContent = 'Loading video…';
      summary.textContent = '';
      video.src = URL.createObjectURL(file);

      await new Promise(resolve => {
        video.onloadedmetadata = resolve;
      });

      // downscale to 640 wide, keep aspect ratio
      const scale = 640 / video.videoWidth;
      const w = 640;
      const h = Math.round(video.videoHeight * scale);
      canvas.width = w;
      canvas.height = h;

      progress.textContent = `Video: ${video.videoWidth}×${video.videoHeight}, ` +
        `${video.duration.toFixed(1)}s — analysing at ${w}×${h}…`;

      const frames = await extractAllFrames(video, canvas, 1, frac => {
        progress.textContent = `Extracting… ${(frac * 100).toFixed(0)}%`;
      });

      progress.textContent = `Done! ${frames.length} frames extracted.`;

      // show first frame features
      if (frames.length > 0) {
        output.textContent = JSON.stringify(frames[0], null, 2);
      }

      // show summary: min / mean / max of scalars
      const keys = ['brightness', 'hue', 'saturation', 'edges', 'motion'];
      let lines = `${'feature'.padEnd(14)} ${'min'.padStart(8)} ${'mean'.padStart(8)} ${'max'.padStart(8)}\n`;
      lines += '-'.repeat(42) + '\n';
      for (const k of keys) {
        const vals = frames.map(f => f[k]);
        const lo = Math.min(...vals);
        const hi = Math.max(...vals);
        const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
        lines += `${k.padEnd(14)} ${lo.toFixed(3).padStart(8)} ${avg.toFixed(3).padStart(8)} ${hi.toFixed(3).padStart(8)}\n`;
      }
      lines += `\ncolumns length: ${frames[0].columns.length} (expected ${N_STRIPS})\n`;
      lines += `column_heights length: ${frames[0].column_heights.length}\n`;
      lines += `column_hues length: ${frames[0].column_hues.length}\n`;
      summary.textContent = lines;
    }
  </script>
</body>
</html>
